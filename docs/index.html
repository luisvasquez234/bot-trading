<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot de Trading (Paper)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --green: #16794f;
    --green-bg: #e7f6ef;
    --red: #b3261e;
    --red-bg: #fbeae9;
    --accent: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1d2025;
      --text: #f0f0f0;
      --muted: #9aa0aa;
      --border: #2c3038;
      --green: #4ade80;
      --green-bg: #123626;
      --red: #f87171;
      --red-bg: #3a1c1c;
      --accent: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 24px;
    padding-inline: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; }
  .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; }
  .stat .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat .value { font-size: 1.3rem; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .pill.buy { background: var(--green-bg); color: var(--green); }
  .pill.skip { background: var(--border); color: var(--muted); }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .table-wrap { overflow-x: auto; }
  .loser-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .loser-chip {
    font-size: 0.78rem;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--red-bg);
    color: var(--red);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Bot de Trading — Paper</h1>
  <div class="sub" id="updated">Cargando...</div>

  <div class="card">
    <h2>Cuenta (simulada)</h2>
    <div class="stat-row" id="account"></div>
  </div>

  <div class="card">
    <h2>¿Compró algo hoy?</h2>
    <div id="today"></div>
  </div>

  <div class="card">
    <h2>Posiciones abiertas</h2>
    <div class="table-wrap" id="positions"></div>
  </div>

  <div class="card">
    <h2>Órdenes recientes</h2>
    <div class="table-wrap" id="orders"></div>
  </div>
</div>

<script>
  function money(n) {
    const num = Number(n);
    if (Number.isNaN(num)) return "-";
    return "$" + num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(n) {
    const num = Number(n) * 100;
    if (Number.isNaN(num)) return "-";
    return num.toFixed(2) + "%";
  }
  function fmtDate(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    return d.toLocaleString("es-US", { dateStyle: "medium", timeStyle: "short" });
  }

  fetch("status.json?_=" + Date.now())
    .then((r) => r.json())
    .then(render)
    .catch(() => {
      document.getElementById("updated").textContent = "Todavia no hay datos. El bot aun no ha corrido.";
    });

  function render(s) {
    document.getElementById("updated").textContent = "Ultima actualizacion: " + fmtDate(s.updatedAt);

    document.getElementById("account").innerHTML = `
      <div class="stat"><div class="label">Equity</div><div class="value">${money(s.account?.equity)}</div></div>
      <div class="stat"><div class="label">Efectivo</div><div class="value">${money(s.account?.cash)}</div></div>
      <div class="stat"><div class="label">Posiciones</div><div class="value">${s.positions?.length ?? 0}</div></div>
    `;

    const today = s.today || {};
    let todayHtml = "";
    if (today.bought && today.bought.length > 0) {
      todayHtml += `<p><span class="pill buy">Compró ${today.bought.length}</span></p><ul>`;
      for (const b of today.bought) {
        todayHtml += `<li>${b.symbol} a ~${money(b.price)} (RSI ${b.rsi?.toFixed?.(1) ?? b.rsi})</li>`;
      }
      todayHtml += "</ul>";
    } else {
      todayHtml += `<p><span class="pill skip">No compró</span> ${today.skippedReason || ""}</p>`;
    }
    if (today.topLosers && today.topLosers.length > 0) {
      todayHtml += `<p class="empty">Mas caidas del dia:</p><div class="loser-list">`;
      for (const l of today.topLosers.slice(0, 10)) {
        todayHtml += `<span class="loser-chip">${l.symbol} ${pct(l.percentChange / 100)}</span>`;
      }
      todayHtml += "</div>";
    }
    document.getElementById("today").innerHTML = todayHtml || `<p class="empty">Sin datos de hoy.</p>`;

    const positions = s.positions || [];
    if (positions.length === 0) {
      document.getElementById("positions").innerHTML = `<p class="empty">No hay posiciones abiertas.</p>`;
    } else {
      let rows = positions.map((p) => {
        const cls = Number(p.unrealizedPl) >= 0 ? "pos" : "neg";
        return `<tr>
          <td>${p.symbol}</td>
          <td>${p.qty}</td>
          <td>${money(p.avgEntryPrice)}</td>
          <td>${money(p.currentPrice)}</td>
          <td class="${cls}">${money(p.unrealizedPl)} (${pct(p.unrealizedPlpc)})</td>
        </tr>`;
      }).join("");
      document.getElementById("positions").innerHTML = `
        <table>
          <thead><tr><th>Símbolo</th><th>Cant.</th><th>Entrada</th><th>Actual</th><th>P/L</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    const orders = s.recentOrders || [];
    if (orders.length === 0) {
      document.getElementById("orders").innerHTML = `<p class="empty">Sin órdenes recientes.</p>`;
    } else {
      let rows = orders.map((o) => `<tr>
        <td>${o.symbol}</td>
        <td>${o.side === "buy" ? "Compra" : "Venta"}</td>
        <td>${o.qty ?? "-"}</td>
        <td>${o.filledAvgPrice ? money(o.filledAvgPrice) : "-"}</td>
        <td>${fmtDate(o.filledAt)}</td>
      </tr>`).join("");
      document.getElementById("orders").innerHTML = `
        <table>
          <thead><tr><th>Símbolo</th><th>Tipo</th><th>Cant.</th><th>Precio</th><th>Fecha</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }
  }
</script>
</body>
</html>
